name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff check backend frontend tests scripts run_app.py
      - run: python -m ruff format --check backend frontend tests scripts run_app.py
      - run: python -m mypy backend
      - run: python -m pytest --cov=backend --cov-report=term-missing --cov-fail-under=75
      - name: Verify migrations from an empty database
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///migration_ci.db
          AUTH_MODE: development
          JWT_SECRET: ci-secret-that-is-definitely-longer-than-32-characters
          SEED_DEMO_DATA: "false"
        run: python -m alembic upgrade head

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --target backend -t fintech-backend:test .
      - run: docker build --target frontend -t fintech-frontend:test .
      - run: docker build -t corebank:test corebank

  corebank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x corebank/mvnw
      - run: ./mvnw test
        working-directory: corebank

  integration:
    runs-on: ubuntu-latest
    needs: [test, corebank]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps
      - run: chmod +x corebank/mvnw
      - name: Start CoreBank
        working-directory: corebank
        env:
          COREBANK_SERVICE_TOKEN: local-corebank-service-token-change-me
        run: nohup ./mvnw spring-boot:run > ../corebank-ci.log 2>&1 &
      - name: Wait for CoreBank
        run: |
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8080/accounts/health && exit 0
            sleep 2
          done
          cat corebank-ci.log
          exit 1
      - name: Seed CoreBank
        run: python scripts/seed_corebank_demo.py
      - name: Verify chatbot-to-CoreBank contract
        env:
          RUN_LIVE_COREBANK_TESTS: "1"
          BANKING_DATA_SOURCE: corebank
          COREBANK_BASE_URL: http://127.0.0.1:8080
          COREBANK_SERVICE_TOKEN: local-corebank-service-token-change-me
          COREBANK_FALLBACK_TO_LOCAL: "false"
        run: python -m pytest tests/integration/test_live_corebank.py -q
      - name: Verify support from the signed-in customer portal
        env:
          APP_ENV: development
          AUTH_MODE: development
          JWT_SECRET: ci-secret-that-is-definitely-longer-than-32-characters
          DATABASE_URL: sqlite:///portal_ci.db
          SEED_DEMO_DATA: "true"
          BANKING_DATA_SOURCE: corebank
          COREBANK_SERVICE_TOKEN: local-corebank-service-token-change-me
          COREBANK_FALLBACK_TO_LOCAL: "false"
          LLM_PROVIDER: local
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > support-ci.log 2>&1 &
          support_pid=$!
          trap 'kill "$support_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health/ready; then
            cat support-ci.log
            exit 1
          fi

          RUN_LIVE_PORTAL_HELP_TESTS=1 python -m pytest tests/integration/test_live_portal_help.py -q
