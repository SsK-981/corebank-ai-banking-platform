[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-ai-agent-chatbot"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "streamlit>=1.44,<2",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
  "openai>=2,<3",
  "PyJWT[crypto]>=2.10,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["data*", "frontend*", "screenshots*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
