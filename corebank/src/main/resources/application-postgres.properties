spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:banking}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:banking}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.flyway.enabled=true

app.security.admin-code=${APP_ADMIN_CODE}
app.security.ai-service-token=${COREBANK_SERVICE_TOKEN}
springdoc.swagger-ui.path=/swagger-ui.html
