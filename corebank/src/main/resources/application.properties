spring.application.name=bankingapp

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/corebank;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.flyway.enabled=true

app.security.admin-code=${APP_ADMIN_CODE:admin123}
app.security.ai-service-token=${COREBANK_SERVICE_TOKEN:local-corebank-service-token-change-me}
springdoc.swagger-ui.path=/swagger-ui.html
